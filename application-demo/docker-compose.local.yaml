services:
  api:
    build:
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN apt-get update && apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-nep libgl1 wget \
            && rm -rf /var/lib/apt/lists/*
        RUN pip install --no-cache-dir "lamisema[s3]>=1.2.0"
        RUN mkdir -p /app/fonts && \
            wget -q "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf" \
            -O /app/fonts/NotoSansDevanagari.ttf
        ENV PORT=9001 LAMI_FONT_PATH=/app/fonts/NotoSansDevanagari.ttf
        EXPOSE 9001
        CMD ["lamisema", "serve"]
    ports:
      - "8001:9001"
    env_file: .env
    depends_on:
      - minio

  webapp:
    build: ./webapp
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - api

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
