site_name: LamiSema
site_description: Structured Information Extraction Optimized for Nepali and multilingual PDFs
site_author: Sanjib Lamichhane
site_url: https://lamisema.readthedocs.io
repo_url: https://github.com/sanjiblamichhane/lamisema
repo_name: sanjiblamichhane/lamisema

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - The Encoding Problem: encoding-types.md
  - Python API: python-api.md
  - REST API: api-reference.md
  - Extending to Other Languages: extending-languages.md
  - Deployment & Persistence: deployment.md
  - Benchmark: benchmark.md
  - Contributing: contributing.md

plugins:
  - search
